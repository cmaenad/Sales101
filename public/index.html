<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>FinPulse — Acceso</title>
</head>
<body>
    <header class="site-header">
        <div class="brand">FinPulse</div>
        <div class="subtitle">Herramienta de soporte — Acceso</div>
    </header>

    <main class="center-wrap">
        <section class="card login-card" id="login-container">
            <h3 class="card-title">Autenticación</h3>
            <form id="login-form" class="form">
                <label for="email">Identificador corporativo</label>
                <input type="email" id="email" required autocomplete="username">

                <label for="password">Clave de acceso</label>
                <input type="password" id="password" required autocomplete="current-password">

                <button type="submit" class="btn primary">Iniciar sesión</button>
            </form>
            <p id="error-message" class="error" style="display: none;"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
