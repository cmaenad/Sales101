<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente Salesforce Activo</title>
</head>
<body>
    <h2>Interfaz de Agente de Salesforce</h2>
    <div id="status-indicator">Verificando memoria persistente...</div>
    
    <div id="chat-window" style="height: 300px; border: 1px solid black; overflow-y: scroll; margin-bottom: 10px; padding: 10px;">
    </div>

    <form id="chat-form">
        <input type="text" id="chat-input" required placeholder="Ingrese comando para el agente..." style="width: 80%;">
        <button type="submit">Transmisión</button>
    </form>

    <br>
    <button id="logout-button">Destruir Sesión (Logout)</button>

    <script src="chat.js"></script>
</body>
</html>
